<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskGravity — Practical 03: ReactJS Standalone Preview</title>
  
  <!-- React 18 & ReactDOM UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --tg-bg: #f8fafc;
      --tg-surface: #ffffff;
      --tg-surface-subtle: #f1f5f9;
      --tg-border: #e2e8f0;
      --tg-text: #0f172a;
      --tg-text-muted: #64748b;
      --tg-primary: #1e293b;
      --tg-primary-hover: #0f172a;
      --tg-accent: #2563eb;
      --tg-success: #059669;
      --tg-danger: #dc2626;
      --tg-radius-md: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--tg-bg); color: var(--tg-text); }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.25rem; }
    header { background: var(--tg-surface); border-bottom: 1px solid var(--tg-border); padding: 0.85rem 0; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin: 1.5rem 0; }
    .stat-card { background: var(--tg-surface); border: 1px solid var(--tg-border); border-radius: 6px; padding: 1rem 1.15rem; }
    .main-grid { display: grid; grid-template-columns: 360px 1fr; gap: 1.5rem; align-items: start; margin-bottom: 3rem; }
    @media(max-width: 900px){ .main-grid { grid-template-columns: 1fr; } }
    .panel { background: var(--tg-surface); border: 1px solid var(--tg-border); border-radius: 6px; padding: 1.25rem; }
    .form-group { margin-bottom: 0.9rem; }
    .form-control { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--tg-border); border-radius: 6px; font-size: 0.875rem; }
    .form-control.error { border-color: var(--tg-danger); background-color: #fef2f2; }
    .error-text { font-size: 0.725rem; color: var(--tg-danger); margin-top: 0.25rem; }
    .alert-success { background: #ecfdf5; color: #047857; border: 1px solid #d1fae5; padding: 0.6rem; border-radius: 6px; margin-bottom: 0.75rem; font-size: 0.8rem; }
    .alert-danger { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; padding: 0.6rem; border-radius: 6px; margin-bottom: 0.75rem; font-size: 0.8rem; }
    .btn { display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid transparent; cursor: pointer; }
    .btn-primary { background: var(--tg-primary); color: #fff; }
    .btn-secondary { background: var(--tg-surface); border-color: var(--tg-border); }
    .task-item { background: var(--tg-surface); border: 1px solid var(--tg-border); border-radius: 6px; padding: 0.95rem 1.15rem; margin-bottom: 0.65rem; }
    .task-item.completed { opacity: 0.75; background: #f8fafc; text-decoration: line-through; }
    .badge { font-size: 0.7rem; font-weight: 600; padding: 0.2rem 0.5rem; border-radius: 4px; border: 1px solid transparent; }
    .badge-urgent { background: #fef2f2; color: #991b1b; }
    .badge-high { background: #fff7ed; color: #c2410c; }
    .badge-medium { background: #fffbeb; color: #92400e; }
    .badge-low { background: #f1f5f9; color: #334155; }
    .badge-completed { background: #ecfdf5; color: #047857; }
    .badge-progress { background: #eff6ff; color: #1d4ed8; }
    .badge-pending { background: #f1f5f9; color: #475569; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SEED_TASKS = [
      { id: 'tg-1', title: 'Implement React Controlled Components', category: 'Frontend', priority: 'High', dueDate: '2026-11-21', estimatedHours: 4, description: 'Client-side state management with hooks.', status: 'in-progress' },
      { id: 'tg-2', title: 'Draft Express Server-Side Validation', category: 'Backend', priority: 'Urgent', dueDate: '2026-11-23', estimatedHours: 6, description: 'Configure validator middleware.', status: 'pending' },
      { id: 'tg-3', title: 'Mongoose Task Schema Modeling', category: 'Database', priority: 'Medium', dueDate: '2026-11-25', estimatedHours: 3, description: 'Define schema indices and timestamps.', status: 'completed' }
    ];

    function App() {
      const [tasks, setTasks] = useState(() => {
        try {
          const s = localStorage.getItem('TaskGravity_React_Standalone');
          if (s) return JSON.parse(s);
        } catch (e) {}
        return SEED_TASKS;
      });

      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('all');
      const [categoryFilter, setCategoryFilter] = useState('all');
      const [sortBy, setSortBy] = useState('dueDate');

      const [formData, setFormData] = useState({ title: '', category: 'Frontend', priority: 'Medium', dueDate: '', estimatedHours: '', description: '' });
      const [errors, setErrors] = useState({});
      const [successMsg, setSuccessMsg] = useState('');

      useEffect(() => {
        localStorage.setItem('TaskGravity_React_Standalone', JSON.stringify(tasks));
      }, [tasks]);

      const handleAdd = (e) => {
        e.preventDefault();
        const errs = {};
        if (!formData.title.trim() || formData.title.trim().length < 3) errs.title = 'Title must be at least 3 chars.';
        if (!formData.dueDate) errs.dueDate = 'Target deadline is required.';
        const h = parseFloat(formData.estimatedHours);
        if (!h || h <= 0 || h > 100) errs.estimatedHours = 'Hours must be 1 - 100.';

        if (Object.keys(errs).length > 0) {
          setErrors(errs);
          return;
        }

        const newTask = {
          id: 'tg-' + Date.now().toString().slice(-4),
          ...formData,
          estimatedHours: h,
          status: 'pending'
        };

        setTasks([newTask, ...tasks]);
        setSuccessMsg(`Task "${newTask.title}" added successfully!`);
        setFormData({ title: '', category: 'Frontend', priority: 'Medium', dueDate: '', estimatedHours: '', description: '' });
        setErrors({});
        setTimeout(() => setSuccessMsg(''), 3000);
      };

      const toggleStatus = (id) => {
        setTasks(tasks.map(t => {
          if (t.id === id) {
            const next = t.status === 'pending' ? 'in-progress' : (t.status === 'in-progress' ? 'completed' : 'pending');
            return { ...t, status: next };
          }
          return t;
        }));
      };

      const deleteTask = (id) => {
        if (confirm('Delete task?')) {
          setTasks(tasks.filter(t => t.id !== id));
        }
      };

      const filtered = useMemo(() => {
        return tasks.filter(t => {
          if (statusFilter !== 'all' && t.status !== statusFilter) return false;
          if (categoryFilter !== 'all' && t.category !== categoryFilter) return false;
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return t.title.toLowerCase().includes(q) || (t.description || '').toLowerCase().includes(q);
          }
          return true;
        }).sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
      }, [tasks, searchQuery, statusFilter, categoryFilter]);

      const total = tasks.length;
      const completed = tasks.filter(t => t.status === 'completed').length;
      const inProg = tasks.filter(t => t.status === 'in-progress').length;
      const velocity = total > 0 ? Math.round((completed / total) * 100) : 0;

      return (
        <div>
          <header>
            <div className="container" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', fontWeight: 700 }}>
                <span style={{ background: '#1e293b', color: '#fff', padding: '4px 8px', borderRadius: 4 }}>TG</span>
                <span>TaskGravity</span>
              </div>
              <div style={{ fontSize: '0.8rem', color: '#64748b' }}>
                Practical 03 &bull; ReactJS (Standalone Preview)
              </div>
            </div>
          </header>

          <div className="container">
            <div className="stats-grid">
              <div className="stat-card">
                <div style={{ fontSize: '0.75rem', fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>Total Tasks</div>
                <div style={{ fontSize: '1.6rem', fontWeight: 700 }}>{total}</div>
              </div>
              <div className="stat-card">
                <div style={{ fontSize: '0.75rem', fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>In Progress</div>
                <div style={{ fontSize: '1.6rem', fontWeight: 700, color: '#1d4ed8' }}>{inProg}</div>
              </div>
              <div className="stat-card">
                <div style={{ fontSize: '0.75rem', fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>Completed</div>
                <div style={{ fontSize: '1.6rem', fontWeight: 700, color: '#047857' }}>{completed}</div>
              </div>
              <div className="stat-card">
                <div style={{ fontSize: '0.75rem', fontWeight: 600, color: '#64748b', textTransform: 'uppercase' }}>Velocity</div>
                <div style={{ fontSize: '1.6rem', fontWeight: 700, color: '#047857' }}>{velocity}%</div>
              </div>
            </div>

            <div className="main-grid">
              <aside className="panel">
                <h3 style={{ fontSize: '1rem', fontWeight: 700, marginBottom: '0.5rem' }}>Add Task Item</h3>
                {successMsg && <div className="alert-success">{successMsg}</div>}
                <form onSubmit={handleAdd}>
                  <div className="form-group">
                    <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: 4 }}>Title *</label>
                    <input className={`form-control ${errors.title ? 'error' : ''}`} value={formData.title} onChange={e => setFormData({ ...formData, title: e.target.value })} />
                    {errors.title && <div className="error-text">{errors.title}</div>}
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                    <div className="form-group">
                      <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: 4 }}>Category</label>
                      <select className="form-control" value={formData.category} onChange={e => setFormData({ ...formData, category: e.target.value })}>
                        <option value="Frontend">Frontend</option>
                        <option value="Backend">Backend</option>
                        <option value="Database">Database</option>
                        <option value="DevOps">DevOps</option>
                        <option value="Testing">Testing</option>
                      </select>
                    </div>
                    <div className="form-group">
                      <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: 4 }}>Priority</label>
                      <select className="form-control" value={formData.priority} onChange={e => setFormData({ ...formData, priority: e.target.value })}>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Urgent">Urgent</option>
                      </select>
                    </div>
                  </div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                    <div className="form-group">
                      <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: 4 }}>Deadline *</label>
                      <input type="date" className={`form-control ${errors.dueDate ? 'error' : ''}`} value={formData.dueDate} onChange={e => setFormData({ ...formData, dueDate: e.target.value })} />
                      {errors.dueDate && <div className="error-text">{errors.dueDate}</div>}
                    </div>
                    <div className="form-group">
                      <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: 4 }}>Hours *</label>
                      <input type="number" className={`form-control ${errors.estimatedHours ? 'error' : ''}`} value={formData.estimatedHours} onChange={e => setFormData({ ...formData, estimatedHours: e.target.value })} />
                      {errors.estimatedHours && <div className="error-text">{errors.estimatedHours}</div>}
                    </div>
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '0.8rem', fontWeight: 600, display: 'block', marginBottom: 4 }}>Description</label>
                    <textarea rows="2" className="form-control" value={formData.description} onChange={e => setFormData({ ...formData, description: e.target.value })} />
                  </div>
                  <button type="submit" className="btn btn-primary" style={{ width: '100%', marginTop: '6px' }}>Save Task</button>
                </form>
              </aside>

              <section>
                <div style={{ display: 'flex', gap: '8px', marginBottom: '1rem', flexWrap: 'wrap' }}>
                  <input type="search" placeholder="Search tasks..." className="form-control" style={{ width: 220 }} value={searchQuery} onChange={e => setSearchQuery(e.target.value)} />
                  <select className="form-control" style={{ width: 'auto' }} value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
                    <option value="all">Status: All</option>
                    <option value="pending">Pending</option>
                    <option value="in-progress">In Progress</option>
                    <option value="completed">Completed</option>
                  </select>
                  <select className="form-control" style={{ width: 'auto' }} value={categoryFilter} onChange={e => setCategoryFilter(e.target.value)}>
                    <option value="all">Category: All</option>
                    <option value="Frontend">Frontend</option>
                    <option value="Backend">Backend</option>
                    <option value="Database">Database</option>
                    <option value="DevOps">DevOps</option>
                    <option value="Testing">Testing</option>
                  </select>
                </div>

                <div>
                  {filtered.length === 0 ? (
                    <div style={{ textAlign: 'center', padding: '2rem', background: '#fff', border: '1px dashed #e2e8f0', borderRadius: 6, color: '#64748b' }}>No tasks found.</div>
                  ) : (
                    filtered.map(t => (
                      <article key={t.id} className={`task-item ${t.status === 'completed' ? 'completed' : ''}`}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                          <label style={{ display: 'flex', alignItems: 'center', gap: '8px', cursor: 'pointer' }}>
                            <input type="checkbox" checked={t.status === 'completed'} onChange={() => toggleStatus(t.id)} />
                            <strong>{t.title}</strong>
                          </label>
                          <div style={{ display: 'flex', gap: '6px' }}>
                            <span className={`badge badge-${t.priority.toLowerCase()}`}>{t.priority}</span>
                            <span className={`badge badge-${t.status === 'in-progress' ? 'progress' : t.status}`}>{t.status}</span>
                          </div>
                        </div>
                        {t.description && <p style={{ fontSize: '0.8rem', color: '#64748b', margin: '6px 0 0 24px' }}>{t.description}</p>}
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8, paddingTop: 6, borderTop: '1px solid #f1f5f9', fontSize: '0.75rem', color: '#64748b', marginLeft: 24 }}>
                          <span>Due: <strong>{t.dueDate}</strong> &bull; Est: <strong>{t.estimatedHours}h</strong></span>
                          <div style={{ display: 'flex', gap: '6px' }}>
                            <button className="btn btn-secondary" style={{ padding: '2px 6px', fontSize: '0.75rem' }} onClick={() => toggleStatus(t.id)}>Cycle</button>
                            <button className="btn" style={{ padding: '2px 6px', fontSize: '0.75rem', color: '#dc2626' }} onClick={() => deleteTask(t.id)}>Delete</button>
                          </div>
                        </div>
                      </article>
                    ))
                  )}
                </div>
              </section>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
